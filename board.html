<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Pertandingan - Edu Game Arena</title>

  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
  <link rel="stylesheet" href="styles/board.css">
  <link rel="stylesheet" href="styles/footer.css" />
</head>

<body>
  <div class="container board-container">
    <div class="card result-card">
      
      <!-- Trophy & Glow Animation -->
      <div class="trophy-wrapper">
        <div class="trophy-halo"></div>
        <div class="trophy" id="trophy">🏆</div>
      </div>

      <!-- Result Header -->
      <div class="result-header">
        <div class="badge-pill" id="badge">HASIL PERTANDINGAN</div>
        <h1 id="title" class="result-title">Pemenang!</h1>
        <div class="winner-name" id="winner">TIM A</div>
        <p class="winner-quote" id="winner-quote">Selamat atas kemenangan yang gemilang!</p>
      </div>

      <!-- Versus Score Arena -->
      <div class="scores" id="scores"></div>

      <!-- Match Statistics Pill Bar -->
      <div class="match-stats" id="match-stats"></div>

      <!-- Action Buttons -->
      <div class="actions">
        <a href="game.html" class="btn btn-primary">
          <span class="btn-icon">🔄</span> Main Lagi
        </a>
        <a href="index.html" class="btn btn-secondary">
          <span class="btn-icon">🏠</span> Beranda
        </a>
      </div>

    </div>
  </div>

  <div id="footer-container"></div>

  <script src="js/footer.js"></script>
  <script src="js/board.js"></script>
</body>

</html>
